<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#232A20" />
    <title>Pa internet | Bella Casa</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: #232A20;
        color: #F1E9DB;
        font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 360px; display: grid; gap: 18px; justify-items: center; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 {
        font-family: 'Cormorant Variable', 'Cormorant Garamond', Georgia, serif;
        font-weight: 500;
        font-size: 34px;
        line-height: 1.1;
      }
      p { color: rgba(241, 233, 219, 0.78); line-height: 1.55; }
      button {
        margin-top: 8px;
        padding: 13px 28px;
        border: 1px solid #CCA57D;
        border-radius: 2px;
        background: transparent;
        color: #CCA57D;
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      button:hover, button:focus-visible { background: #CCA57D; color: #1C130F; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Bella Casa" width="88" height="88" />
      <h1>Nuk ka lidhje me internetin</h1>
      <p>Kjo faqe nuk është ruajtur për përdorim pa internet. Kontrolloni lidhjen tuaj dhe provoni sërish.</p>
      <button type="button" onclick="location.reload()">Provo sërish</button>
    </main>
  </body>
</html>
